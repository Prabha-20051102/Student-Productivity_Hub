<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Student Productivity Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🎓</div>
        <div class="brand-text">
          <h2>Student Hub</h2>
          <p>Productivity Suite</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Main Menu</div>
        <a href="dashboard.html" class="nav-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Dashboard
        </a>
        <a href="tasks.html" class="nav-link active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
          My Tasks
        </a>
        <a href="timetable.html" class="nav-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Timetable
        </a>
        <a href="assignments.html" class="nav-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          Assignments
        </a>
        <a href="progress.html" class="nav-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          Study Progress
        </a>
        <a href="pomodoro.html" class="nav-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Pomodoro Timer
        </a>
        <div class="nav-label">Settings</div>
        <a href="profile.html" class="nav-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          My Profile
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button id="menuToggle" class="menu-toggle-btn" aria-label="Toggle Menu">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <h1 class="page-title">My Tasks</h1>
        </div>

        <div class="header-right">
          <div class="current-date">
            <span>📅</span>
            <span id="currentDateText">Loading date...</span>
          </div>
          <a href="profile.html" class="user-profile-badge">
            <div id="headerAvatar" class="user-avatar">S</div>
            <div class="user-meta">
              <div id="headerUserName" class="user-name">Student</div>
              <div id="headerUserRole" class="user-role">Student</div>
            </div>
          </a>
        </div>
      </header>

      <main class="page-container">
        
        <!-- Action Header & Filters -->
        <div class="card">
          <div class="card-body" style="padding: 20px;">
            <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center;">
              
              <!-- Filter Controls -->
              <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
                <div>
                  <select id="filterStatus" class="form-control" style="width: 150px;">
                    <option value="All">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                  </select>
                </div>
                <div>
                  <select id="filterPriority" class="form-control" style="width: 150px;">
                    <option value="All">All Priorities</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                  </select>
                </div>
                <div>
                  <input type="text" id="searchTaskInput" class="form-control" placeholder="Search tasks..." style="width: 220px;">
                </div>
              </div>

              <!-- Open Modal Button -->
              <button id="openAddTaskBtn" class="btn btn-primary">
                <span>+</span> Add Daily Task
              </button>

            </div>
          </div>
        </div>

        <!-- Task List Table -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <span>📋</span> Tasks List (<span id="taskCountLabel">0</span>)
            </h2>
          </div>
          <div class="card-body" style="padding: 0;">
            <div class="table-responsive">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th style="width: 40px;"></th>
                    <th>Task Details</th>
                    <th>Priority</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="tasksTableBody">
                  <tr>
                    <td colspan="6" style="text-align: center; padding: 32px; color: var(--text-muted);">
                      Loading tasks from database...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Task Add / Edit Modal -->
  <div id="taskModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">Add New Task</h3>
        <button id="closeModalBtn" class="modal-close">&times;</button>
      </div>

      <form id="taskForm">
        <div class="modal-body">
          <input type="hidden" id="taskId">

          <div class="form-group">
            <label class="form-label" for="taskTitle">Task Title *</label>
            <input type="text" id="taskTitle" class="form-control" placeholder="e.g. Read Operating Systems Chapter 3" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="taskDescription">Description (Optional)</label>
            <textarea id="taskDescription" class="form-control" rows="3" placeholder="Brief notes or requirements..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="taskPriority">Priority</label>
              <select id="taskPriority" class="form-control">
                <option value="High">High Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="Low">Low Priority</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDueDate">Due Date *</label>
              <input type="date" id="taskDueDate" class="form-control" required>
            </div>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveTaskBtn" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
