<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Student Productivity Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">🎓</div>
        <h1>Student Productivity Hub</h1>
        <p>Sign in to your student dashboard</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="alert alert-danger" style="display: none;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email">Student Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="student@college.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary auth-btn">
          Sign In to Dashboard
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? 
        <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfLoggedIn();

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const loginBtn = document.getElementById('loginBtn');

    // Check for expired session query
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('session') === 'expired') {
      alertBox.textContent = 'Your session has expired. Please log in again.';
      alertBox.className = 'alert alert-info';
      alertBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store token and user information
          setToken(data.token);
          setUser(data.user);
          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          alertBox.textContent = data.message || 'Login failed. Please check your credentials.';
          alertBox.className = 'alert alert-danger';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'Server connection error. Make sure the backend server is running.';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
